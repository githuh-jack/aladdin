aladdin:
  # ==============================
  # 安全模块配置
  # ==============================
  security:
    # 是否启用安全模块
    # 开启影响：所有接口需要认证，未登录请求返回401
    # 关闭影响：所有接口可匿名访问，仅用于开发调试
    enabled: true
    # 安全白名单路径，这些路径不需要认证即可访问
    whitelist:
      - /system/public/**
      - /css/**
      - /js/**
      - /img/**
      - /login
      - /ajaxLogin
      - /**/login
      - /**/logout
      - /sso/welcome
      - /**/register
      - /verifyCode/**
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-resources/**
      - /actuator/**
    # 是否启用操作日志记录
    # 开启影响：所有标注@OperLog的接口操作会被记录到日志表
    # 关闭影响：不再记录操作日志，已有日志不受影响
    oper-log-enabled: true
    # Token配置
    token:
      # JWT签名密钥，生产环境务必修改
      secret: aladdin-platform-secret-key-2026
      # Token过期时间（分钟），过期后需重新登录
      expire-minutes: 30
      # Token请求头名称
      header: Authorization
      # Token前缀
      prefix: "Bearer "
    # 密码策略配置
    password:
      # 是否启用密码策略
      # 开启影响：登录时校验密码过期、输错锁定、强制修改等
      # 关闭影响：不校验密码策略，仅验证密码正确性
      enabled: true
      # 新用户创建/密码重置时的默认密码
      default-password: "123456"
      # 允许连续输错次数，超过后锁定账号
      max-retry-count: 5
      # 账号锁定时长（分钟），超时后自动解锁
      lock-duration-minutes: 30
      # 是否强制首次登录修改密码
      # 开启影响：新用户首次登录必须修改密码才能使用系统
      # 关闭影响：新用户可直接使用默认密码登录
      force-change-on-first-login: true
      # 密码过期天数，0表示永不过期
      expire-days: 90
      # 密码历史记录数，修改密码时不能与最近N次密码相同
      history-count: 3
    # IP黑白名单配置
    ip-list:
      # 模式：off-关闭 | blacklist-仅黑名单 | whitelist-仅白名单 | both-黑白名单同时生效
      # off：不进行IP过滤，所有IP均可访问
      # blacklist：黑名单中的IP无法访问系统
      # whitelist：仅白名单中的IP可以访问系统，其他IP全部拒绝
      # both：黑名单优先拒绝，白名单优先放行，其余默认放行
      mode: "off"
    # 租户配置
    tenant:
      # 是否启用租户数据隔离
      # 开启影响：所有含tenant_id字段的表自动按租户隔离数据，用户只能看到本租户数据
      # 关闭影响：不进行租户隔离，所有用户可看到全部数据
      enabled: false
